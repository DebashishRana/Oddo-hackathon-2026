services:
  db:
    image: postgres:16-alpine
    container_name: saas-starter-db
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
      POSTGRES_DB: starter
    ports:
      - "5432:5432"
    volumes:
      - starter_db_data:/var/lib/postgresql/data

volumes:
  starter_db_data:
